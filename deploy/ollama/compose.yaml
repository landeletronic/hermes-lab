name: hermes-lab-ollama

services:
  ollama:
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    container_name: hermes-lab-ollama
    restart: unless-stopped
    init: true
    networks:
      - ollama_internal
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - /srv/hermes-lab/ollama:/root/.ollama
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  ollama_internal:
    name: hermes-lab-ollama
    internal: true
